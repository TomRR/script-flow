name: 'Upload Azure release artifacts'
description: 'Upload versioned installers, a prefixed updater feed, and a latest.json manifest to Azure Blob Storage.'

inputs:
  app_id:
    description: 'Stable application id used as the blob path root.'
    required: true
  version:
    description: 'Semantic version without the leading v.'
    required: true
  tag:
    description: 'Release tag, used as the release path segment.'
    required: true
  storage_account:
    description: 'Azure Storage account name.'
    required: true
  container_name:
    description: 'Azure Blob Storage container name.'
    required: true
  sas_token:
    description: 'Azure Blob Storage SAS token with create, write, and read permissions.'
    required: true
  installer_paths:
    description: 'Newline-separated installer paths to upload to the versioned release directory.'
    required: true
  updater_paths:
    description: 'Newline-separated updater payload and manifest paths to publish below updater_prefix.'
    required: false
    default: ''
  updater_prefix:
    description: 'Blob path below the app root used for updater payloads and manifests.'
    required: false
    default: 'updates'
  public_base_url:
    description: 'Optional public container URL. Defaults to the storage account blob endpoint plus container.'
    required: false
    default: ''
  azcopy_version:
    description: 'Pinned AzCopy release version used for uploads.'
    required: false
    default: '10.32.6'
  azcopy_sha256:
    description: 'SHA-256 checksum for the pinned Linux x64 AzCopy archive.'
    required: false
    default: '6538f7fb9ec6e4d159e44a1612ca7eee24fe7a822065a3dcbc664ef30fe85d16'

runs:
  using: 'composite'
  steps:
    - name: Upload installers and updater feed
      shell: bash
      env:
        APP_ID: ${{ inputs.app_id }}
        VERSION: ${{ inputs.version }}
        TAG: ${{ inputs.tag }}
        STORAGE_ACCOUNT: ${{ inputs.storage_account }}
        CONTAINER_NAME: ${{ inputs.container_name }}
        SAS_TOKEN: ${{ inputs.sas_token }}
        INSTALLER_PATHS: ${{ inputs.installer_paths }}
        UPDATER_PATHS: ${{ inputs.updater_paths }}
        UPDATER_PREFIX: ${{ inputs.updater_prefix }}
        PUBLIC_BASE_URL: ${{ inputs.public_base_url }}
        AZCOPY_VERSION: ${{ inputs.azcopy_version }}
        AZCOPY_SHA256: ${{ inputs.azcopy_sha256 }}
      run: |
        set -euo pipefail

        if [[ -z "${PUBLIC_BASE_URL}" ]]; then
          PUBLIC_BASE_URL="https://${STORAGE_ACCOUNT}.blob.core.windows.net/${CONTAINER_NAME}"
        fi

        PUBLIC_BASE_URL="${PUBLIC_BASE_URL%/}"
        UPDATER_PREFIX="${UPDATER_PREFIX#/}"
        UPDATER_PREFIX="${UPDATER_PREFIX%/}"

        if [[ ! "$PUBLIC_BASE_URL" =~ ^https://[^[:space:]=]+(/[^[:space:]=]*)?$ ]]; then
          echo 'AZURE_INSTALLER_PUBLIC_BASE_URL must be an HTTPS URL.' >&2
          exit 1
        fi

        if [[ -z "$UPDATER_PREFIX" || "$UPDATER_PREFIX" == *'..'* || "$UPDATER_PREFIX" == *'?'* || "$UPDATER_PREFIX" == *'#'* ]]; then
          echo 'updater_prefix must be a safe, non-empty relative blob path.' >&2
          exit 1
        fi

        work_dir="${RUNNER_TEMP}/azure-release-installers"
        assets_jsonl="${work_dir}/assets.jsonl"
        latest_json="${work_dir}/latest.json"
        azcopy_dir="${RUNNER_TEMP}/azcopy-${AZCOPY_VERSION}"
        azcopy_archive="${azcopy_dir}.tar.gz"
        azcopy_url="https://github.com/Azure/azure-storage-azcopy/releases/download/v${AZCOPY_VERSION}/azcopy_linux_amd64_${AZCOPY_VERSION}.tar.gz"

        mkdir -p "$work_dir"
        : > "$assets_jsonl"

        curl --fail --location --silent --show-error --output "$azcopy_archive" "$azcopy_url"
        printf '%s  %s\n' "$AZCOPY_SHA256" "$azcopy_archive" | sha256sum --check --status
        mkdir -p "$azcopy_dir"
        tar --extract --gzip --file "$azcopy_archive" --directory "$azcopy_dir"
        azcopy_executable="$(find "$azcopy_dir" -type f -name azcopy -print -quit)"

        if [[ -z "$azcopy_executable" ]]; then
          echo "AzCopy executable was not found in $azcopy_archive." >&2
          exit 1
        fi

        chmod +x "$azcopy_executable"

        mapfile -t installer_paths <<< "$INSTALLER_PATHS"
        mapfile -t updater_paths <<< "$UPDATER_PATHS"

        append_sas_token() {
          local url="$1"
          local token="${SAS_TOKEN#\?}"

          printf '%s?%s' "$url" "$token"
        }

        content_type_for() {
          local file_name="$1"

          case "${file_name,,}" in
            *.dmg)
              printf 'application/x-apple-diskimage'
              ;;
            *.exe)
              printf 'application/vnd.microsoft.portable-executable'
              ;;
            *.appimage)
              printf 'application/octet-stream'
              ;;
            *.zip | *.blockmap)
              printf 'application/zip'
              ;;
            *.yml | *.yaml)
              printf 'application/yaml'
              ;;
            *.json)
              printf 'application/json'
              ;;
            *)
              printf 'application/octet-stream'
              ;;
          esac
        }

        platform_for() {
          local file_name="$1"

          case "${file_name,,}" in
            *.dmg)
              printf 'macos'
              ;;
            *.exe)
              printf 'windows'
              ;;
            *.appimage)
              printf 'linux'
              ;;
            *)
              printf 'unknown'
              ;;
          esac
        }

        azcopy_upload() {
          local source_path="$1"
          local destination_url="$2"
          local content_type="$3"

          "$azcopy_executable" copy "$source_path" "$destination_url" --overwrite=true --content-type "$content_type" </dev/null
        }

        declare -A installer_platform_counts=()
        installer_count=0

        for installer_path in "${installer_paths[@]}"; do
          if [[ -z "$installer_path" ]]; then
            continue
          fi

          if [[ ! -f "$installer_path" ]]; then
            echo "Release installer file not found: $installer_path" >&2
            exit 1
          fi

          file_name="$(basename "$installer_path")"
          blob_path="${APP_ID}/releases/${TAG}/${file_name}"
          source_path="$(realpath "$installer_path")"
          url="${PUBLIC_BASE_URL}/${blob_path}"
          content_type="$(content_type_for "$file_name")"
          platform="$(platform_for "$file_name")"

          if [[ "$platform" == 'unknown' ]]; then
            echo "Unsupported installer type: $installer_path" >&2
            exit 1
          fi

          installer_platform_counts["$platform"]=$(( ${installer_platform_counts["$platform"]:-0} + 1 ))
          installer_count=$((installer_count + 1))
        done

        for expected_platform in macos windows linux; do
          if [[ "${installer_platform_counts["$expected_platform"]:-0}" -ne 1 ]]; then
            echo "Expected exactly one ${expected_platform} installer." >&2
            exit 1
          fi
        done

        if [[ "$installer_count" -ne 3 ]]; then
          echo "Expected exactly three installers, got $installer_count." >&2
          exit 1
        fi

        declare -A updater_file_counts=()
        updater_count=0

        for updater_path in "${updater_paths[@]}"; do
          if [[ -z "$updater_path" ]]; then
            continue
          fi

          if [[ ! -f "$updater_path" ]]; then
            echo "Updater file not found: $updater_path" >&2
            exit 1
          fi

          file_name="$(basename "$updater_path")"
          case "${file_name,,}" in
            latest.yml)
              updater_kind='latest.yml'
              ;;
            latest-mac.yml)
              updater_kind='latest-mac.yml'
              ;;
            *.zip.blockmap)
              updater_kind='zip.blockmap'
              ;;
            *.zip)
              updater_kind='zip'
              ;;
            *.exe.blockmap)
              updater_kind='exe.blockmap'
              ;;
            *.exe)
              updater_kind='exe'
              ;;
            *)
              echo "Unsupported updater file: $updater_path" >&2
              exit 1
              ;;
          esac

          updater_file_counts["$updater_kind"]=$(( ${updater_file_counts["$updater_kind"]:-0} + 1 ))
          updater_count=$((updater_count + 1))
        done

        if [[ "$updater_count" -gt 0 ]]; then
          for expected_updater_kind in latest.yml latest-mac.yml zip zip.blockmap exe exe.blockmap; do
            if [[ "${updater_file_counts["$expected_updater_kind"]:-0}" -ne 1 ]]; then
              echo "Expected exactly one ${expected_updater_kind} updater file." >&2
              exit 1
            fi
          done

          if [[ "$updater_count" -ne 6 ]]; then
            echo "Expected exactly six updater files, got $updater_count." >&2
            exit 1
          fi
        fi

        for installer_path in "${installer_paths[@]}"; do
          if [[ -z "$installer_path" ]]; then
            continue
          fi

          file_name="$(basename "$installer_path")"
          blob_path="${APP_ID}/releases/${TAG}/${file_name}"
          source_path="$(realpath "$installer_path")"
          url="${PUBLIC_BASE_URL}/${blob_path}"
          content_type="$(content_type_for "$file_name")"
          platform="$(platform_for "$file_name")"

          azcopy_upload "$source_path" "$(append_sas_token "$url")" "$content_type"

          sha256="$(sha256sum "$installer_path" | awk '{print $1}')"
          size_bytes="$(wc -c < "$installer_path" | tr -d '[:space:]')"

          python3 - "$assets_jsonl" "$platform" "$file_name" "$blob_path" "$url" "$sha256" "$size_bytes" "$content_type" <<'PY'
        import json
        import sys

        path, platform, file_name, blob_path, url, sha256, size_bytes, content_type = sys.argv[1:]
        with open(path, "a", encoding="utf-8") as handle:
            handle.write(json.dumps({
                "platform": platform,
                "fileName": file_name,
                "path": blob_path,
                "url": url,
                "sha256": sha256,
                "sizeBytes": int(size_bytes),
                "contentType": content_type,
            }, separators=(",", ":")) + "\n")
        PY
        done

        python3 - "$assets_jsonl" "$latest_json" "$APP_ID" "$VERSION" "$TAG" <<'PY'
        import datetime
        import json
        import sys

        assets_path, latest_path, app_id, version, tag = sys.argv[1:]
        files = {}

        with open(assets_path, "r", encoding="utf-8") as handle:
            for line in handle:
                if not line.strip():
                    continue

                asset = json.loads(line)
                platform = asset.pop("platform")
                if platform in files:
                    raise RuntimeError(f"Duplicate installer platform: {platform}")
                files[platform] = asset

        expected_platforms = {"macos", "windows", "linux"}
        if set(files) != expected_platforms:
            raise RuntimeError(f"Expected installers for {sorted(expected_platforms)}, got {sorted(files)}")

        manifest = {
            "appId": app_id,
            "version": version,
            "tag": tag,
            "publishedAt": datetime.datetime.now(datetime.UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
            "files": files,
        }

        with open(latest_path, "w", encoding="utf-8") as handle:
            json.dump(manifest, handle, indent=2)
            handle.write("\n")
        PY

        latest_url="$(append_sas_token "${PUBLIC_BASE_URL}/${APP_ID}/latest.json")"
        azcopy_upload "$latest_json" "$latest_url" 'application/json'

        upload_updater_files() {
          local manifests_only="$1"

          for updater_path in "${updater_paths[@]}"; do
            if [[ -z "$updater_path" ]]; then
              continue
            fi

            file_name="$(basename "$updater_path")"
            is_manifest=false
            if [[ "$file_name" == 'latest.yml' || "$file_name" == 'latest-mac.yml' ]]; then
              is_manifest=true
            fi

            if [[ "$manifests_only" != "$is_manifest" ]]; then
              continue
            fi

            source_path="$(realpath "$updater_path")"
            destination_url="$(append_sas_token "${PUBLIC_BASE_URL}/${APP_ID}/${UPDATER_PREFIX}/${file_name}")"
            azcopy_upload "$source_path" "$destination_url" "$(content_type_for "$file_name")"
          done
        }

        upload_updater_files false
        upload_updater_files true
